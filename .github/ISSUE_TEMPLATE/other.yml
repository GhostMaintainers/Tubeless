name: Other
description: For everything else
body:
  - type: markdown
    attributes:
      value: '**PLEASE NOTE:**'
  - type: markdown
    attributes:
      value: |
        Only dependency updates and security fixes will be addressed in this fork. I am not interested in touching Pinchflat's codebase. For new features, bug fixes, and/or minor issues, please consider switching to [Pinchflat-NGX](https://github.com/TheBadFella/Pinchflat-NGX).
  - type: textarea
    id: text
    attributes:
      label: Text field
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: 'If applicable, add screenshots for additional context.'
    validations:
      required: false
